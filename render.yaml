services:
  - type: web
    name: monkeyspeak-dg-proxy
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_PROJECT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_DEEPGRAM_PROXY_URL
        sync: false
